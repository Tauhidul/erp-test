name: Mukut ERP tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *' # nightly full run (UTC)

env:
  CI: true
  MUKUT_BASE_URL: ${{ vars.MUKUT_BASE_URL }}
  MUKUT_API_URL: ${{ vars.MUKUT_API_URL }}
  MUKUT_SALES_REP_USER: ${{ secrets.MUKUT_SALES_REP_USER }}
  MUKUT_SALES_REP_PASSWORD: ${{ secrets.MUKUT_SALES_REP_PASSWORD }}
  MUKUT_BUYER_USER: ${{ secrets.MUKUT_BUYER_USER }}
  MUKUT_BUYER_PASSWORD: ${{ secrets.MUKUT_BUYER_PASSWORD }}
  MUKUT_WAREHOUSE_CLERK_USER: ${{ secrets.MUKUT_WAREHOUSE_CLERK_USER }}
  MUKUT_WAREHOUSE_CLERK_PASSWORD: ${{ secrets.MUKUT_WAREHOUSE_CLERK_PASSWORD }}
  MUKUT_ACCOUNTANT_USER: ${{ secrets.MUKUT_ACCOUNTANT_USER }}
  MUKUT_ACCOUNTANT_PASSWORD: ${{ secrets.MUKUT_ACCOUNTANT_PASSWORD }}
  MUKUT_FINANCE_MANAGER_USER: ${{ secrets.MUKUT_FINANCE_MANAGER_USER }}
  MUKUT_FINANCE_MANAGER_PASSWORD: ${{ secrets.MUKUT_FINANCE_MANAGER_PASSWORD }}
  MUKUT_ADMIN_USER: ${{ secrets.MUKUT_ADMIN_USER }}
  MUKUT_ADMIN_PASSWORD: ${{ secrets.MUKUT_ADMIN_PASSWORD }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # Every pull request: smoke + API/aggregate rules + P0 journeys
  pull-request:
    if: github.event_name != 'schedule'
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=smoke --project=api --project=p2p --project=o2c --project=r2r --grep "@smoke|@api|@P0"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pr-reports, path: reports/, retention-days: 14 }

  # Nightly: everything, all browsers for smoke
  nightly:
    if: github.event_name == 'schedule'
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nightly-reports, path: reports/, retention-days: 30 }
